name: Build linux-tkg

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Arch packages
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Build in Arch Linux container
        shell: bash
        run: |
          docker run --rm \
            --privileged \
            --volume "$GITHUB_WORKSPACE:/build" \
            --workdir /build \
            archlinux:latest \
            bash -lc '
              set -euo pipefail

              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm \
                base-devel \
                git \
                sudo

              useradd --create-home --shell /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 440 /etc/sudoers.d/builder

              chown -R builder:builder /build

              sudo --user builder \
                env _EXT_CONFIG_PATH=/build/ci/linux-tkg.cfg \
                bash -lc "
                  cd /build
                  makepkg --syncdeps --noconfirm --cleanbuild
                "
            '

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p packages

          find . -type f \
            \( -name "*.pkg.tar.zst" -o -name "*.pkg.tar.xz" \) \
            -exec cp -v {} packages/ \;

          echo "Produced packages:"
          ls -lah packages

          test -n "$(find packages -type f -name '*.pkg.tar.*' -print -quit)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tkg-alderlake
          path: packages/*
          if-no-files-found: error
          retention-days: 14
