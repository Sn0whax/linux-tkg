name: Build my linux-tkg kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Alder Lake linux-tkg
    runs-on: ubuntu-latest
    timeout-minutes: 355

    container:
      image: archlinux:latest

    env:
      # Path to your override file inside the checked-out repository
      _EXT_CONFIG_PATH: ${{ github.workspace }}/ci/linux-tkg.cfg

      # Put completed packages somewhere predictable
      PKGDEST: /tmp/linux-tkg-packages

      # CI-specific options
      _git_mirror: gregkh
      _noccache: "true"
      _STRIP: "true"
      _kernel_work_folder: /tmp
      _kernel_source_folder: /tmp
      _nofallback: "true"

    steps:
      - name: Install Git
        run: pacman -Syu --noconfirm git

      - name: Check out linux-tkg
        uses: actions/checkout@v4

      - name: Prepare Arch build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel sudo

          useradd --create-home --shell /bin/bash builder

          echo "builder ALL=(ALL) NOPASSWD: ALL" \
            > /etc/sudoers.d/builder

          chmod 440 /etc/sudoers.d/builder

          mkdir -p "$PKGDEST"

          chown -R builder:builder "$GITHUB_WORKSPACE"
          chown -R builder:builder "$PKGDEST"
          chown -R builder:builder /tmp

      - name: Display effective CI configuration
        run: |
          echo "External configuration: $_EXT_CONFIG_PATH"
          echo "Package destination: $PKGDEST"
          test -f "$_EXT_CONFIG_PATH"
          cat "$_EXT_CONFIG_PATH"

      - name: Compile kernel
        run: |
          su --preserve-environment builder -c '
            cd "$GITHUB_WORKSPACE"
            yes "" | makepkg --syncdeps --noconfirm --cleanbuild
          '

      - name: Save generated kernel configuration
        if: always()
        run: |
          if test -f kernelconfig.new; then
            cp kernelconfig.new kernelconfig.arch.alderlake.txt
          fi

      - name: List generated packages
        run: |
          echo "Generated files:"
          find "$PKGDEST" -maxdepth 1 -type f -print

          test -n "$(
            find "$PKGDEST" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.*' \
              -print \
              -quit
          )"

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-tkg-alderlake
          path: |
            /tmp/linux-tkg-packages/*.pkg.tar.zst
            /tmp/linux-tkg-packages/*.pkg.tar.xz
            kernelconfig.arch.alderlake.txt
          if-no-files-found: error
          retention-days: 14
