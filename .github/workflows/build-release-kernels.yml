name: Build & Release Latest Kernel

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  kver-checks:
    runs-on: ubuntu-latest

    outputs:
      latest_release: ${{ steps.latest_release.outputs.release }}
      latest_kernel: ${{ steps.versions.outputs.latest_kernel }}

    steps:
      - name: Get latest release
        id: latest_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          latest_release="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          echo "release=$latest_release" >> "$GITHUB_OUTPUT"

          if [[ -n "$latest_release" ]]; then
            echo "Latest release: $latest_release"
          else
            echo "No existing release found. The first release will be built."
          fi

      - name: Checkout linux-tkg
        uses: actions/checkout@v5

      - name: Get latest kernel version
        id: versions
        shell: bash
        run: |
          get_latest_kernel() {
            git -c 'versionsort.suffix=-' \
              ls-remote --exit-code --refs --sort='version:refname' \
              --tags https://github.com/gregkh/linux.git '*.*' \
              | cut --delimiter='/' --fields=3 \
              | grep "v$1" \
              | tail -n 1
          }

          grep "_current_kernels=(" linux-tkg-config/prepare > current_kernels.txt
          source current_kernels.txt

          latest_kernel="$(get_latest_kernel "${_current_kernels[0]}")"

          if [[ -z "$latest_kernel" || "$latest_kernel" == *rc* ]]; then
            latest_kernel="$(get_latest_kernel "${_current_kernels[1]}")"
          fi

          if [[ -z "$latest_kernel" ]]; then
            echo "::error::Could not determine the latest stable kernel version"
            exit 1
          fi

          echo "latest_kernel=$latest_kernel" >> "$GITHUB_OUTPUT"
          echo "Latest stable kernel: $latest_kernel"

  build:
    needs: [kver-checks]
    if: >-
      needs.kver-checks.outputs.latest_kernel != '' &&
      needs.kver-checks.outputs.latest_kernel != needs.kver-checks.outputs.latest_release

    strategy:
      fail-fast: false
      matrix:
        _cpusched: [eevdf, bore, pds, bmq, muqss]
        os: [arch, ubuntu, fedora]

    uses: ./.github/workflows/builder-dispatcher.yml
    with:
      _cpusched: ${{ matrix._cpusched }}
      os: ${{ matrix.os }}

  make-release:
    runs-on: ubuntu-latest
    needs:
      - kver-checks
      - build
    if: needs.build.result == 'success'

    steps:
      - name: Checkout linux-tkg
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4

      - name: Make new release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.kver-checks.outputs.latest_kernel }}
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . -path './*-kernel-packages-*/*' -type f -print0
          )

          if (( ${#files[@]} == 0 )); then
            echo "::error::No kernel package artifacts were downloaded"
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${files[@]}" \
            --latest \
            --title "diet linux-tkg $RELEASE_TAG" \
            --notes 'This is a version of linux-tkg built with the option `_kernel_on_diet` enabled.

          If you encounter issues with it, please build the kernel locally with that option disabled.'
