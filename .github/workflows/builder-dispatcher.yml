name: Builder Dispatcher

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      _cpusched:
        required: true
        type: string

jobs:
  dispatch-to-fedora:
    name: Fedora
    if: inputs.os == 'fedora'
    uses: ./.github/workflows/fedora-builder.yml
    with:
      _cpusched: ${{ inputs._cpusched }}

  dispatch-to-ubuntu:
    name: Ubuntu
    if: inputs.os == 'ubuntu'
    uses: ./.github/workflows/ubuntu-builder.yml
    with:
      _cpusched: ${{ inputs._cpusched }}

  dispatch-to-arch:
    name: Arch
    if: inputs.os == 'arch'
    uses: ./.github/workflows/arch-builder.yml
    with:
      _cpusched: ${{ inputs._cpusched }}
